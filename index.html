<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora IA</title>
  <style>
    /* Estilos Globais */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      overflow: hidden;
    }

    /* Modal / Popup de Boas-Vindas */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 1;
      transition: opacity 0.4s ease, visibility 0.4s;
    }

    .modal-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .modal-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 40px 30px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      animation: popup 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popup {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .modal-card h2 {
      font-size: 1.8rem;
      margin-bottom: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(90deg, #00d2ff, #3a7bd5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-card p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: #d1d5db;
      margin-bottom: 30px;
    }

    /* Botão "OK" Estilizado */
    .btn-ok {
      background: linear-gradient(135deg, #00d2ff 0%, #3a7bd5 100%);
      color: #ffffff;
      border: none;
      padding: 12px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
      transition: all 0.3s ease;
      outline: none;
    }

    .btn-ok:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0, 210, 255, 0.5);
    }

    .btn-ok:active {
      transform: translateY(1px);
    }

    /* Layout da Calculadora */
    .calculator {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 25px;
      width: 320px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
    }

    .display {
      width: 100%;
      height: 70px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      color: #ffffff;
      font-size: 2.2rem;
      text-align: right;
      padding: 15px;
      margin-bottom: 20px;
      overflow-x: auto;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .btn {
      height: 55px;
      border: none;
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 500;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .btn.operator {
      background: rgba(0, 210, 255, 0.15);
      color: #00d2ff;
    }

    .btn.operator:hover {
      background: rgba(0, 210, 255, 0.3);
    }

    .btn.equal {
      background: linear-gradient(135deg, #00d2ff, #3a7bd5);
      grid-column: span 2;
      font-weight: bold;
    }

    .btn.equal:hover {
      opacity: 0.9;
    }

    .btn.clear {
      color: #ff5e62;
      background: rgba(255, 94, 98, 0.15);
    }

    .btn.clear:hover {
      background: rgba(255, 94, 98, 0.3);
    }
  </style>
</head>
<body>

  <!-- Mensagem de Entrada (Modal) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h2>Bem-vindo!</h2>
      <p>Este site foi <strong>100% feito por inteligência artificial</strong>.</p>
      <button class="btn-ok" onclick="fecharModal()">OK</button>
    </div>
  </div>

  <!-- Calculadora -->
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="btn clear" onclick="clearDisplay()">C</button>
      <button class="btn operator" onclick="appendCharacter('/')">/</button>
      <button class="btn operator" onclick="appendCharacter('*')">×</button>
      <button class="btn operator" onclick="appendCharacter('-')">-</button>

      <button class="btn" onclick="appendCharacter('7')">7</button>
      <button class="btn" onclick="appendCharacter('8')">8</button>
      <button class="btn" onclick="appendCharacter('9')">9</button>
      <button class="btn operator" onclick="appendCharacter('+')">+</button>

      <button class="btn" onclick="appendCharacter('4')">4</button>
      <button class="btn" onclick="appendCharacter('5')">5</button>
      <button class="btn" onclick="appendCharacter('6')">6</button>

      <button class="btn equal" onclick="calculate()">=</button>

      <button class="btn" onclick="appendCharacter('1')">1</button>
      <button class="btn" onclick="appendCharacter('2')">2</button>
      <button class="btn" onclick="appendCharacter('3')">3</button>

      <button class="btn" onclick="appendCharacter('0')" style="grid-column: span 2;">0</button>
      <button class="btn" onclick="appendCharacter('.')">.</button>
    </div>
  </div>

  <script>
    // Fechar o aviso de IA
    function fecharModal() {
      document.getElementById('modalOverlay').classList.add('hidden');
    }

    // Lógica da Calculadora
    const display = document.getElementById('display');

    function appendCharacter(char) {
      if (display.innerText === '0' || display.innerText === 'Erro') {
        display.innerText = char;
      } else {
        display.innerText += char;
      }
    }

    function clearDisplay() {
      display.innerText = '0';
    }

    function calculate() {
      try {
        display.innerText = eval(display.innerText.replace('×', '*'));
      } catch (e) {
        display.innerText = 'Erro';
      }
    }
  </script>
</body>
</html>
