<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para o Meu Amor ❤️</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #ffe6e8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 350px;
      width: 100%;
      position: relative;
    }

    h1 {
      color: #ff4b72;
      font-size: 22px;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
      position: relative;
      min-height: 120px;
    }

    button {
      width: 100%;
      max-width: 220px;
      padding: 12px 15px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .btn-sim {
      background-color: #20c997;
      color: white;
    }

    .btn-nao {
      background-color: #ff4d4d;
      color: white;
      position: absolute;
      top: 60px;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1 id="titulo">Você me perdoa? ❤️💔😢😭<br>🥺😔💔❤️</h1>
    
    <div class="btn-container">
      <button class="btn-sim" onclick="aceitou()">Eu te desculpo</button>
      <button class="btn-nao" id="btnNao" onclick="fugir()" ontouchstart="fugir()" onmouseover="fugir()">Não desculpo</button>
    </div>
  </div>

  <script>
    function aceitou() {
      document.getElementById('card').innerHTML = `
        <h1 style="color: #ff4b72; font-size: 24px;">Te amo muito! ❤️🥰😍</h1>
        <p style="color: #555; font-size: 16px;">Prometo te fazer a pessoa mais feliz do mundo!</p>
      `;
    }

    function fugir() {
      const btnNao = document.getElementById('btnNao');
      const x = Math.floor(Math.random() * (window.innerWidth - 120));
      const y = Math.floor(Math.random() * (window.innerHeight - 50));
      
      btnNao.style.position = 'fixed';
      btnNao.style.left = x + 'px';
      btnNao.style.top = y + 'px';
    }
  </script>

</body>
</html>
