<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para o Meu Amor ❤️</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #ffe6e8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    .card {
      background: #ffffff;
      padding: 30px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      max-width: 350px;
      width: 100%;
    }

    h1 {
      color: #ff4b72;
      font-size: 22px;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
      margin-top: 15px;
    }

    button, .btn {
      width: 100%;
      max-width: 220px;
      padding: 12px 15px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-sim {
      background-color: #20c997;
      color: white;
    }

    .btn-nao {
      background-color: #ff4d4d;
      color: white;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Você me perdoa? ❤️💔😢😭<br>🥺😔💔❤️</h1>
    
    <div class="btn-container">
      <button class="btn-sim">Eu te desculpo</button>
      <button class="btn-nao">Não desculpo</button>
    </div>
  </div>

</body>
</html>
