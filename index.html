<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Momento Especial</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: crosshair;
            user-select: none;
        }

        #area-jogo {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* HUD Moderno */
        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 12px 30px;
            border-radius: 50px;
            color: white;
            font-size: 20px;
            font-weight: 700;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 10;
        }

        .hud-item span {
            color: #f1c40f;
        }

        /* Balão Aprimorado (Branco) */
        .balao {
            position: absolute;
            width: 60px;
            height: 75px;
            background: radial-gradient(circle at 35% 35%, #ffffff 0%, #e0e0e0 60%, #bdc3c7 100%);
            border-radius: 50% 50% 48% 50%;
            box-shadow: inset -8px -10px 15px rgba(0, 0, 0, 0.15), 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s ease;
            cursor: pointer;
            z-index: 5;
        }

        .balao::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-bottom: 9px solid #d5d8dc;
        }

        .balao::before {
            content: '';
            position: absolute;
            bottom: -18px;
            left: 48%;
            width: 2px;
            height: 13px;
            background-color: rgba(255, 255, 255, 0.6);
        }

        .balao.estourando {
            transform: scale(1.6);
            opacity: 0;
        }

        /* Telas Centrais */
        .tela-centro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            z-index: 20;
            display: none;
            max-width: 400px;
            width: 90%;
        }

        .tela-centro h1 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 28px;
        }
