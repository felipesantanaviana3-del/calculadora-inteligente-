<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mensagem Especial com Música</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }

        .cartao-mensagem {
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .cartao-mensagem p {
            font-size: 20px;
            line-height: 1.6;
            color: #2c3e50;
            margin: 0;
        }

        .coracao {
            font-size: 30px;
            margin-top: 20px;
            display: inline-block;
            animation: pulsar 1.5s infinite alternate;
        }

        @keyframes pulsar {
            0% { transform: scale(1); }
            100% { transform: scale(1.2); }
        }

        /* Estilo do botão de música */
        .btn-som {
            margin-top: 25px;
            padding: 10px 20px;
            font-size: 16px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
            cursor: pointer;
            background: linear-gradient(135deg, #9b59b6, #8e44ad);
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 5px 15px rgba(155, 89, 182, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-som:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(155, 89, 182, 0.6);
        }
    </style>
</head>
<body>

    <div class="cartao-mensagem">
        <p>
            Você é muito especial pra mim. Gosto muito de ter você na minha vida e de cada momento ao seu lado. Espero fazer momentos lindos com você.
        </p>
        <div class="coracao">💜</div>
        <br>
        <!-- Botão para ligar/desligar a música -->
        <button class="btn-som" id="botaoTocar" onclick="alternarSom()">🎵 Tocar Música Romântica</button>
    </div>

    <!-- Elemento de áudio (usando uma música instrumental relaxante/romântica de domínio público) -->
    <audio id="musicaFundo" loop>
        <source src="https://actions.google.com/sounds/v1/ambiences/gentle_wind.ogg" type="audio/ogg">
        Seu navegador não suporta áudio.
    </audio>

    <script>
        const musica = document.getElementById('musicaFundo');
        const botao = document.getElementById('botaoTocar');
        let tocando = false;

        function alternarSom() {
            if (!tocando) {
                musica.play().then(() => {
                    tocando = true;
                    botao.innerText = "🔇 Pausar Música";
                }).catch(error => {
                    console.log("Erro ao reproduzir áudio: ", error);
                });
            } else {
                musica.pause();
                tocando = false;
                botao.innerText = "🎵 Tocar Música Romântica";
            }
        }
    </script>

</body>
</html>
